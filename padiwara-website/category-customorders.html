<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custom Orders - Padiwara Marketplace</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="home.html" class="text-2xl font-bold text-green-700">Padiwara</a>
      <nav class="space-x-6 text-gray-700 hidden md:flex">
        <a href="home.html" class="hover:text-green-700 transition">Home</a>
        <a href="about.html" class="hover:text-green-700 transition">About Us</a>
        <a href="ecosystem.html" class="hover:text-green-700 transition">Ecosystem</a>
        <a href="marketplace.html" class="hover:text-green-700 transition font-semibold text-green-800">Marketplace</a>
        <a href="impact.html" class="hover:text-green-700 transition">Impact</a>
        <a href="community.html" class="hover:text-green-700 transition">Community</a>
        <a href="contact.html" class="hover:text-green-700 transition">Contact</a>
      </nav>
      <button class="md:hidden text-gray-700 focus:outline-none" aria-label="Toggle menu" id="menu-btn">
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10 space-y-16 max-w-6xl">
    <h1 class="text-4xl font-extrabold text-green-800 mb-10 text-center">Custom Orders</h1>

    <section class="bg-white rounded-lg shadow p-8 max-w-4xl mx-auto">
      <p class="text-gray-700 mb-6 text-center">Have a unique idea? Request a custom product crafted sustainably with rice husk materials by our skilled artisans.</p>
      <form action="#" method="POST" class="space-y-6">
        <div>
          <label for="name" class="block text-gray-700 font-semibold mb-2">Name</label>
          <input type="text" id="name" name="name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="details" class="block text-gray-700 font-semibold mb-2">Order Details</label>
          <textarea id="details" name="details" rows="5" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
        </div>
        <button type="submit" class="bg-green-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-800 transition w-full">Submit Request</button>
      </form>
    </section>
  </main>

  <footer class="bg-white border-t mt-20 py-6 text-center text-gray-600 text-sm">
    &copy; 2024 Padiwara. All rights reserved.
  </footer>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const nav = document.querySelector('nav');
    menuBtn.addEventListener('click', () => {
      nav.classList.toggle('hidden');
    });
  </script>
</body>
</html>
