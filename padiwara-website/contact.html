<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us - Padiwara</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <header class="bg-white shadow">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a href="home.html" class="text-2xl font-bold text-green-700">Padiwara</a>
      <nav class="space-x-6 text-gray-700 hidden md:flex">
        <a href="home.html" class="hover:text-green-700 transition">Home</a>
        <a href="about.html" class="hover:text-green-700 transition">About Us</a>
        <a href="ecosystem.html" class="hover:text-green-700 transition">Ecosystem</a>
        <a href="marketplace.html" class="hover:text-green-700 transition">Marketplace</a>
        <a href="impact.html" class="hover:text-green-700 transition">Impact</a>
        <a href="community.html" class="hover:text-green-700 transition">Community</a>
        <a href="contact.html" class="hover:text-green-700 transition font-semibold text-green-800">Contact</a>
      </nav>
      <button class="md:hidden text-gray-700 focus:outline-none" aria-label="Toggle menu" id="menu-btn">
        <i class="fas fa-bars fa-lg"></i>
      </button>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10 space-y-16 max-w-4xl">
    <h1 class="text-4xl font-extrabold text-green-800 mb-10 text-center">Contact Us</h1>

    <!-- Contact Form -->
    <section>
      <form class="bg-white rounded-lg shadow p-8 space-y-6" action="#" method="POST" aria-label="Contact form">
        <div>
          <label for="name" class="block text-gray-700 font-semibold mb-2">Name</label>
          <input type="text" id="name" name="name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" id="email" name="email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="message" class="block text-gray-700 font-semibold mb-2">Message</label>
          <textarea id="message" name="message" rows="5" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
        </div>
        <button type="submit" class="bg-green-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-800 transition">Send Message</button>
      </form>
    </section>

    <!-- Office Locations & Map -->
    <section>
      <h2 class="text-3xl font-bold text-green-800 mb-6 text-center">Office Locations & Map</h2>
      <div class="bg-white rounded-lg shadow p-6">
        <p class="text-gray-700 mb-4">Head Office: Jl. Sustainable No. 12, Jakarta, Indonesia</p>
        <div class="aspect-w-16 aspect-h-9">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126915.123456789!2d106.689431!3d-6.229386!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e69f3f3f3f3f3f3%3A0x123456789abcdef!2sJakarta%2C%20Indonesia!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus"
            width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            title="Padiwara Office Location"></iframe>
        </div>
      </div>
    </section>

    <!-- Become a Partner / Join Us Form -->
    <section>
      <h2 class="text-3xl font-bold text-green-800 mb-6 text-center">Become a Partner / Join Us</h2>
      <form class="bg-white rounded-lg shadow p-8 space-y-6" action="#" method="POST" aria-label="Partner form">
        <div>
          <label for="partner-name" class="block text-gray-700 font-semibold mb-2">Name</label>
          <input type="text" id="partner-name" name="partner-name" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="partner-email" class="block text-gray-700 font-semibold mb-2">Email</label>
          <input type="email" id="partner-email" name="partner-email" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600" />
        </div>
        <div>
          <label for="partner-message" class="block text-gray-700 font-semibold mb-2">Message</label>
          <textarea id="partner-message" name="partner-message" rows="4" required class="w-full border border-gray-300 rounded-md px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-600"></textarea>
        </div>
        <button type="submit" class="bg-green-700 text-white px-6 py-3 rounded-lg font-semibold hover:bg-green-800 transition">Submit</button>
      </form>
    </section>
  </main>

  <footer class="bg-white border-t mt-20 py-6 text-center text-gray-600 text-sm">
    &copy; 2024 Padiwara. All rights reserved.
  </footer>

  <script>
    const menuBtn = document.getElementById('menu-btn');
    const nav = document.querySelector('nav');
    menuBtn.addEventListener('click', () => {
      nav.classList.toggle('hidden');
    });
  </script>
</body>
</html>
